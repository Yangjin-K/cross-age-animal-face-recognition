# 模型配置
model:
  # 特征提取器类型: resnet50, vit
  backbone: vit
  # 嵌入维度
  embedding_size: 512
  # 分类头参数
  arcface:
    margin: 0.4
    scale: 48.0
  # ViT参数
  vit:
    model_name: vit_b_16
    pretrained: true
  # 正则化参数
  dropout: 0.5
  # 年龄预测参数
  age_loss_weight: 0.1

# 训练配置
training:
  # 训练轮次
  num_epochs: 25
  # 批次大小
  batch_size: 32
  # 学习率
  learning_rate:
    backbone: 0.0001
    head: 0.001
  # 权重衰减
  weight_decay: 5e-4
  # 动量
  momentum: 0.9
  # 学习率调度器
  scheduler: cosine
  # 梯度反转参数
  rev_lambda: 0.1

# 数据配置
data:
  # 数据集路径
  csv_path: ./data/MFD_metadatas.csv
  # 预处理
  preload_image: true
  # 使用预处理数据集
  pre_dataset: true
