# 模型配置
model:
  # 特征提取器类型: resnet50, vit, swin_t, swin_b
  backbone: resnet50
  # 嵌入维度
  embedding_size: 768
  # 分类头参数
  arcface:
    margin: 0.45  # 增加margin以增加类间分离度
    scale: 64.0
  # 正则化参数
  dropout: 0.8  # 增加dropout率以减少过拟合
  # 时期预测参数
  period_loss_weight: 0.2  # 增加时期损失权重，增强域适应能力
  # 正交策略: None, decoupling, projection
  orthogonal_strategy: projection

# 训练配置
training:
  # 训练轮次
  num_epochs: 80  # 减少训练轮次以避免过拟合
  # 批次大小
  batch_size: 32
  # 学习率 - AdamW需要比SGD低得多
  learning_rate:
    backbone: 1e-5  # 降低学习率
    head: 1e-4     # 降低学习率
  # 权重衰减
  weight_decay: 5e-3  # 增加权重衰减以减少过拟合
  # 动量
  momentum: 0.9
  # 学习率调度器
  scheduler: cosine
  # 梯度反转参数
  rev_lambda: 0.1
  # 早停参数
  patience: 10  # 减少早停耐心，更早停止以避免过拟合

# 数据配置
data:
  # 数据集路径
  csv_path: ./data/MFD_metadatas.csv
  # 预处理
  preload_image: true
  # 使用预处理数据集
  pre_dataset: true